version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://vaultadmin:VaultSecret2026!@postgres:5432/vaultguard?schema=public
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=production-enterprise-vaultguard-session-secret-key-32b
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: VaultSecret2026!
      POSTGRES_DB: vaultguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
