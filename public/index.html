<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VaultGuard - Secure password manager. Store, organize, and protect your passwords with military-grade encryption.">
  <title>VaultGuard — Secure Password Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="10" fill="#1a1a2e"/>
            <path d="M20 8C15.58 8 12 11.58 12 16V18H10V32H30V18H28V16C28 11.58 24.42 8 20 8ZM20 11C22.76 11 25 13.24 25 16V18H15V16C15 13.24 17.24 11 20 11ZM21 26.7V29H19V26.7C18.4 26.37 18 25.74 18 25C18 23.9 18.9 23 20 23C21.1 23 22 23.9 22 25C22 25.74 21.6 26.37 21 26.7Z" fill="#e8e8e8"/>
          </svg>
        </div>
        <h1>VaultGuard</h1>
        <p class="auth-subtitle">Your passwords, encrypted & secure</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">Master Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="loginPassword" name="masterPassword" required autocomplete="current-password" placeholder="Enter your master password">
            <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
        <p class="auth-switch">Don't have an account? <a href="#" id="showRegister">Create one</a></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="registerPassword">Master Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="registerPassword" name="masterPassword" required autocomplete="new-password" placeholder="Min 8 characters" minlength="8">
            <button type="button" class="toggle-password" data-target="registerPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="strength-meter" id="registerStrength">
            <div class="strength-bar"><div class="strength-fill"></div></div>
            <span class="strength-label"></span>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Master Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Repeat your master password">
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="registerBtn">Create Account</button>
        <p class="auth-switch">Already have an account? <a href="#" id="showLogin">Sign in</a></p>
      </form>

      <div id="authMessage" class="auth-message"></div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
