<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VaultGuard - Encrypted & Zero-Knowledge Vault. Store, organize, and protect your passwords securely.">
  <title>VaultGuard — Secure Password Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon-badge">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="brand-title">VaultGuard</h1>
        <p class="auth-subtitle">Encrypted & Zero-Knowledge Vault</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label for="loginEmail">EMAIL ADDRESS</label>
          <input type="email" id="loginEmail" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">MASTER PASSWORD</label>
          <div class="password-input-wrapper">
            <input type="password" id="loginPassword" name="masterPassword" required autocomplete="current-password" placeholder="Enter master password">
            <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-emerald-pill" id="loginBtn">Sign In</button>

        <div class="divider-or">
          <span>OR CONTINUE WITH</span>
        </div>

        <div class="social-login-group">
          <button type="button" class="btn-social-pill" onclick="handleGoogleSSO()">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18" height="18">
            <span>Continue with Google</span>
          </button>

          <button type="button" class="btn-social-pill" onclick="handleAppleSSO()">
            <svg width="18" height="18" viewBox="0 0 170 170" fill="currentColor">
              <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.34.13-9.16-1.9-14.49-6.1-3.48-2.82-7.44-7.6-11.88-14.33-6.62-9.98-11.84-20.94-15.66-32.88-3.82-11.94-5.73-23.32-5.73-34.14 0-14.88 3.82-27.18 11.46-36.9 7.64-9.72 17.2-14.65 28.67-14.8 4.97 0 10.23 1.18 15.79 3.53 5.56 2.35 9.38 3.53 11.46 3.53 1.95 0 5.86-1.24 11.73-3.73 5.87-2.48 10.9-3.6 15.1-3.35 11.46.73 20.6 5.14 27.42 13.23-10.23 6.19-15.22 14.86-14.97 26.02.25 8.71 3.58 15.93 10 21.66 6.42 5.73 14.07 8.93 22.95 9.6-1.57 4.97-3.58 9.97-6.03 15.02zM119.22 31.06c0-7.14 2.65-13.9 7.95-20.28 5.3-6.38 11.8-10.23 19.5-11.55.51 1.02.77 2.04.77 3.06 0 7.01-2.61 13.82-7.83 20.43-5.22 6.61-11.83 10.46-19.83 11.55-.13-.9-.56-2.05-5.56-3.21z"/>
            </svg>
            <span>Continue with Apple</span>
          </button>
        </div>

        <p class="auth-switch">Don't have an account? <a href="#" id="showRegister" class="emerald-link">Sign up, it's free!</a></p>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="registerEmail">EMAIL ADDRESS</label>
          <input type="email" id="registerEmail" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="registerPassword">MASTER PASSWORD</label>
          <div class="password-input-wrapper">
            <input type="password" id="registerPassword" name="masterPassword" required autocomplete="new-password" placeholder="Min 8 characters" minlength="8">
            <button type="button" class="toggle-password" data-target="registerPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="strength-meter" id="registerStrength">
            <div class="strength-bar"><div class="strength-fill"></div></div>
            <span class="strength-label"></span>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">CONFIRM MASTER PASSWORD</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Repeat master password">
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Toggle password visibility">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-emerald-pill" id="registerBtn">Create Account</button>
        <p class="auth-switch">Already have an account? <a href="#" id="showLogin" class="emerald-link">Sign in</a></p>
      </form>

      <div id="authMessage" class="auth-message"></div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
